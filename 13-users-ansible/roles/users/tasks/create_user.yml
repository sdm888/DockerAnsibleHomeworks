- name: Создание пользователя "{{ username }}"
  ansible.builtin.user:
    name: "{{ username }}"
    password: "{{ user_passwords[username] | password_hash('sha512') }}"
    create_home: true
    shell: /bin/bash
  become: true

- name: Генерация ключа SSH для пользователя "{{ username }}"
  ansible.builtin.openssh_keypair:
    path: "{{ users_ssh_key_dir }}/{{ username }}_id_rsa"
    type: rsa
    size: 4096
  register: ssh_key
  delegate_to: localhost

- name: Добавление на удаленный хост ключа пользователя "{{ username }}"
  ansible.builtin.authorized_key:
    user: "{{ username }}"
    state: present
    key: "{{ ssh_key.public_key }}"
  become: true

- name: Добавление в группу docker пользователя "{{ username }}"
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: true
