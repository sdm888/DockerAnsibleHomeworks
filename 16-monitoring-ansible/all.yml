---
- name: Deploy server
  hosts: deploy
  roles:
    - role: preconfig
      tags: preconfig
      become: true
    - role: swarm_init
      tags: swarm_init
    - role: prometheus
      tags: prometheus
    - role: grafana
      tags: grafana
    - role: alertmanager
      tags: alertmanager

- name: Managers
  hosts: managers
  roles:
    - role: preconfig
      tags: preconfig
      become: true
    - role: swarm_join
      tags: swarm_join
      swarm_join_type: manager

- name: Workers
  hosts: workers
  roles:
    - role: preconfig
      tags: preconfig
      become: true
    - role: swarm_join
      tags: swarm_join
      swarm_join_type: worker
