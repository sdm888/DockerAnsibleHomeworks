---
grafana:
  port: 3000

prometheus:
  port: 9090
  scrape_interval: 1m
  scrape_configs:
    - job_name: prometheus
      targets: localhost:9090

alertmanager:
  port: 9093
  global:
    resolve_timeout: 5m
  route:
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 3h
  receivers:
    - name: default
      email_configs:
        - to: "example@example.com"
          from: "alertmanager@example.com"
          smarthost: "smtp.example.com:587"

network_name: monitoring
